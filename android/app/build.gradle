plugins {
    id "com.android.application"
}

def releaseStorePath = providers.environmentVariable("CARTOLITE_ANDROID_KEYSTORE").orNull
def releaseStorePassword = providers.environmentVariable("CARTOLITE_ANDROID_STORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("CARTOLITE_ANDROID_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("CARTOLITE_ANDROID_KEY_PASSWORD").orNull
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace = "org.canadaverse.cartolite"
    compileSdk = 36

    defaultConfig {
        applicationId = "org.canadaverse.cartolite"
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = "1.0.0"
        buildConfigField "String", "CARTOLITE_URL", '"https://carto.canadaverse.org/"'
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        checkDependencies = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
