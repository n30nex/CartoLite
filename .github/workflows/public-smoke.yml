name: Verify deployed Canada visuals

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify production identity without retaining traffic
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
          curl --fail --silent https://carto.canadaverse.org/healthz | jq -e --arg sha "$EXPECTED_SHA" '.gitSha == $sha'
          curl --fail --silent https://carto.canadaverse.org/readyz | jq -e '.ready and .mqtt and .checkpoint and .dropped == 0'
          curl --fail --silent --dump-header "$RUNNER_TEMP/carto-headers" https://carto.canadaverse.org/ --output "$RUNNER_TEMP/carto-page"
          grep -qi '^cache-control:.*no-transform' "$RUNNER_TEMP/carto-headers"
          ! grep -q 'static.cloudflareinsights.com/beacon' "$RUNNER_TEMP/carto-page"
      - name: Install browser tooling
        working-directory: web
        run: |
          npm ci
          npm exec playwright install --with-deps chromium
      - name: Inspect deployed assets using synthetic topology and terrain
        working-directory: web
        env:
          CARTOLITE_BASE_URL: https://carto.canadaverse.org
        run: npm run test:e2e -- netgraph-3d.spec.ts netgraph-regions.spec.ts audio-voices.spec.ts android-motion.spec.ts recovery.spec.ts cinematic.spec.ts dock-terrain.spec.ts display-upgrade.spec.ts terrain.spec.ts labs.spec.ts --project=desktop --project=mobile
      - name: Retain deployment screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: canada-deployed-visuals-${{ inputs.expected_sha }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 30
