name: Verify deployed Canada visuals

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Match main CI view isolation: every existing assertion and limit is retained.
  public-visuals:
    name: Public ${{ matrix.suite }} acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: polish
            specs: visual-polish.spec.ts
          - suite: firehose
            specs: firehose.spec.ts
          - suite: pachinko
            specs: pachinko.spec.ts
          - suite: chronoscope
            specs: chronoscope.spec.ts
          - suite: network
            specs: netgraph-3d.spec.ts netgraph-regions.spec.ts audio-voices.spec.ts android-motion.spec.ts recovery.spec.ts cinematic.spec.ts display-upgrade.spec.ts navigation.spec.ts
          - suite: map
            specs: dock-terrain.spec.ts terrain.spec.ts mobile-ux.spec.ts terminal.spec.ts ui-audit.spec.ts
          - suite: labs
            specs: labs.spec.ts labs-mobile-ux.spec.ts labs-ui-audit.spec.ts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify production identity without retaining traffic
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
          curl --fail --silent https://carto.canadaverse.org/healthz | jq -e --arg sha "$EXPECTED_SHA" '.gitSha == $sha'
          curl --fail --silent https://carto.canadaverse.org/readyz | jq -e '.ready and .mqtt and .checkpoint and .dropped == 0'
          curl --fail --silent --dump-header "$RUNNER_TEMP/carto-headers" https://carto.canadaverse.org/ --output "$RUNNER_TEMP/carto-page"
          grep -qi '^cache-control:.*no-transform' "$RUNNER_TEMP/carto-headers"
          ! grep -q 'static.cloudflareinsights.com/beacon' "$RUNNER_TEMP/carto-page"
      - name: Install browser tooling
        working-directory: web
        run: |
          npm ci
          docker pull mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      - name: Verify deployed memory retention and tab recovery
        if: matrix.suite == 'network'
        working-directory: web
        env:
          CARTOLITE_BASE_URL: https://carto.canadaverse.org
          PLAYWRIGHT_HTML_OUTPUT_DIR: session-public-playwright-report
        run: bash ../scripts/browser-ci.sh long-session.spec.ts --grep 'releases completed|background tabs' --project desktop --retries 0 --output session-public-test-results
      - name: Inspect deployed assets using synthetic topology and terrain
        working-directory: web
        env:
          CARTOLITE_BASE_URL: https://carto.canadaverse.org
        run: bash ../scripts/browser-ci.sh ${{ matrix.specs }} --project=desktop --project=mobile --project=mobile-webkit ${{ matrix.suite == 'polish' && '--project=mobile-landscape' || '' }}
      - name: Retain deployment screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canada-deployed-visuals-${{ inputs.expected_sha }}-${{ matrix.suite }}
          path: |
            web/test-results/
            web/playwright-report/
            web/session-public-test-results/
            web/session-public-playwright-report/
          retention-days: 30
