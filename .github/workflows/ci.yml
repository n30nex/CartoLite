name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: 'Export lockfile updates for review; does not qualify a release'
        type: boolean
        default: false


permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/n30nex/cartolite

jobs:
  refresh-lockfiles:
    name: Refresh dependency lockfiles (review required)
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Resolve npm lockfile without lifecycle scripts
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm update source-map-js --package-lock-only --ignore-scripts
      - name: Resolve Go modules
        working-directory: backend
        run: go mod tidy
      - name: Export reviewable patch tied to source commit
        run: |
          mkdir -p artifacts/dependencies
          git rev-parse HEAD > artifacts/dependencies/source-commit.txt
          git diff --binary -- web/package-lock.json backend/go.mod backend/go.sum > artifacts/dependencies/dependency-lockfiles.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-lockfiles-${{ github.sha }}
          path: artifacts/dependencies/
          if-no-files-found: error

  backend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies) }}
    name: Go test, vet, and race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify modules
        working-directory: backend
        run: go mod verify
      - name: Unit and contract tests
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Race detector
        working-directory: backend
        run: go test -race ./...
      - name: Synthetic ingest index benchmark
        working-directory: backend
        run: go test ./internal/engine -run '^$' -bench BenchmarkNodeRepresentative -benchmem -benchtime=200ms -count=3
      - name: Synthetic hex cleanup benchmark
        working-directory: backend
        run: go test ./internal/meshcore -run '^$' -bench BenchmarkHexCleanup -benchmem -benchtime=200ms -count=3
      - name: Watchdog transition tests
        run: python3 -m unittest deploy.watchdog.test_cartolite_watchdog deploy.backup.test_cartolite_backup deploy.cloudflare.test_region_cache_rule
      - name: Compose region defaults and overrides
        shell: python
        run: |
          import json
          import os
          import subprocess

          for regions in (None, "", "YQA,YYZ"):
              env = dict(os.environ, CARTOLITE_IMAGE="example.invalid/cartolite:test", MQTT_BROKER_URL="tcp://example.invalid:1883")
              env.pop("REGION_ALLOWLIST", None)
              if regions is not None:
                  env["REGION_ALLOWLIST"] = regions
              result = subprocess.check_output(["docker", "compose", "--env-file", ".env.example", "config", "--format", "json"], env=env)
              service = json.loads(result)["services"]["cartolite"]
              assert service["environment"]["REGION_ALLOWLIST"] == (regions or "")
              assert "build" not in service
      - name: Release version consistency
        shell: python
        run: |
          import json
          from pathlib import Path

          version = Path("VERSION").read_text().strip()
          package = json.loads(Path("web/package.json").read_text())
          lock = json.loads(Path("web/package-lock.json").read_text())
          assert package["version"] == lock["version"] == lock["packages"][""]["version"] == version

  frontend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies) }}
    name: Frontend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from lockfile
        working-directory: web
        run: npm ci
      - name: Audit frontend and build dependencies
        working-directory: web
        run: npm audit --audit-level=low
      - name: Unit tests
        working-directory: web
        run: npm test -- --run
      - name: MeshCore Canada region contract
        run: node scripts/check-meshcore-canada-regions.mjs
      - name: Production build
        working-directory: web
        env:
          # Measure the same browser-visible configuration as the published image.
          VITE_CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}
        run: npm run build
      - name: Report frontend artifact sizes
        run: node scripts/report-frontend-size.mjs web/dist

  container:
    name: Container integration, browser, privacy, and scan
    needs: [backend, frontend]
    # Keep the browser dependency environment stable across hosted-runner rollouts.
    runs-on: ubuntu-24.04
    # Full baseline took 49 minutes; the new visual suite adds about two.
    # Added repeated Terminal startup checks; this is orchestration headroom only.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          docker pull mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read build identity
        id: meta
        shell: bash
        run: |
          echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Require CARTO basemap key for trusted release candidates
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}
        run: test -n "$CARTO_BASEMAP_API_KEY"
      - name: Verify CARTO vector authorization
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}
        run: node scripts/check-carto-vector.mjs
      - name: Build linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: cartolite:ci
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          secrets: |
            carto_basemap_api_key=${{ secrets.CARTO_BASEMAP_API_KEY }}
      - name: Report image size and verify runtime identity
        run: |
          bash scripts/report-image-size.sh cartolite:ci
          test "$(docker image inspect cartolite:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect cartolite:ci --format '{{.Architecture}}')" = "amd64"
      - name: Start synthetic broker and CartoLite
        shell: bash
        run: |
          docker network create cartolite-ci
          docker volume create cartolite-ci-data
          docker run --detach --name cartolite-mqtt --network cartolite-ci \
            --mount type=bind,source="$PWD/testdata/mosquitto.conf",target=/mosquitto/config/mosquitto.conf,readonly \
            eclipse-mosquitto:2.0.22
          docker run --detach --name cartolite --network cartolite-ci \
            --publish 127.0.0.1:39476:8080 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 256m \
            --mount source=cartolite-ci-data,target=/data \
            --env HTTP_ADDR=:8080 --env MQTT_ENABLED=true \
            --env MQTT_BROKER_URL=tcp://cartolite-mqtt:1883 \
            --env MQTT_TOPIC=meshcore/# --env MQTT_CLIENT_ID=cartolite-ci \
            --env REGION_ALLOWLIST=YYZ,YKF --env STATE_PATH=/data/state-v1.json \
            cartolite:ci
          for _ in $(seq 1 90); do
            curl --fail --silent http://127.0.0.1:39476/readyz >/dev/null && exit 0
            sleep 1
          done
          docker logs cartolite
          exit 1
      - name: Publish synthetic traffic and verify public boundary
        run: |
          bash scripts/publish-fixture.sh cartolite-mqtt testdata/synthetic-live.ndjson
          bash scripts/integration-smoke.sh http://127.0.0.1:39476 artifacts/integration cartolite-mqtt
      - name: Bounded load smoke
        run: bash scripts/performance-smoke.sh http://127.0.0.1:39476 cartolite-mqtt
      - name: Focused bug-fix regressions before the full browser suites
        working-directory: web
        env:
          CARTOLITE_BASE_URL: http://127.0.0.1:39476
          PLAYWRIGHT_HTML_OUTPUT_DIR: bugfix-playwright-report
        run: bash ../scripts/browser-ci.sh display-upgrade.spec.ts visual-polish.spec.ts ui-audit.spec.ts --grep 'switches buildings|Visual polish chronoscope Home|Regions can retry|leaving a map' --project desktop --project mobile --project mobile-webkit --retries 0 --output bugfix-test-results
      - name: Preserve focused regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cartolite-bugfix-review
          path: |
            web/bugfix-test-results/
            web/bugfix-playwright-report/
          retention-days: 30
      - name: Terrain controls and saved preferences before the full browser suite
        working-directory: web
        env:
          CARTOLITE_BASE_URL: http://127.0.0.1:39476
          PLAYWRIGHT_HTML_OUTPUT_DIR: startup-playwright-report
        run: bash ../scripts/browser-ci.sh dock-terrain.spec.ts --project desktop --repeat-each 3 --retries 0 --output startup-test-results
      - name: Terminal geography on mobile WebKit
        working-directory: web
        env:
          CARTOLITE_BASE_URL: http://127.0.0.1:39476
          PLAYWRIGHT_HTML_OUTPUT_DIR: terminal-startup-playwright-report
        run: bash ../scripts/browser-ci.sh terminal.spec.ts --project mobile-webkit --grep 'Terminal keeps geographic controls' --repeat-each 3 --retries 0 --output terminal-startup-test-results
      - name: Preserve startup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-startup-review
          path: |
            web/startup-test-results/
            web/startup-playwright-report/
            web/terminal-startup-test-results/
            web/terminal-startup-playwright-report/
          retention-days: 7
      - name: Live map journey in a fresh browser process
        working-directory: web
        env:
          CARTOLITE_BASE_URL: http://127.0.0.1:39476
          PLAYWRIGHT_HTML_OUTPUT_DIR: live-map-playwright-report
        shell: bash
        run: |
          publisher_pid=""
          cleanup() {
            if [[ -n "$publisher_pid" ]]; then
              kill "$publisher_pid" >/dev/null 2>&1 || true
              wait "$publisher_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          (
            sleep 1
            while true; do
              FIXTURE_DELAY_SECONDS=0.04 bash ../scripts/publish-fixture.sh cartolite-mqtt ../testdata/synthetic-live.ndjson
              sleep 0.25
            done
          ) &
          publisher_pid="$!"
          bash ../scripts/browser-ci.sh visual-smoke.spec.ts --output live-map-test-results
      - name: Preserve live map journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-live-map-review
          path: |
            web/live-map-test-results/
            web/live-map-playwright-report/
      - name: Visual polish framing, navigation and recovery
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: polish-playwright-report
        run: bash ../scripts/browser-ci.sh visual-polish.spec.ts theme-cohesion.spec.ts --retries 0 --output polish-test-results
      - name: Preserve visual polish evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-polish-${{ github.sha }}
          path: |
            web/polish-test-results/
            web/polish-playwright-report/
      - name: Chronoscope live time, interaction and scale
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: chrono-playwright-report
        run: bash ../scripts/browser-ci.sh chronoscope.spec.ts --retries 0 --output chrono-test-results
      - name: Preserve Chronoscope evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-chronoscope-review
          retention-days: 7
          path: |
            web/chrono-test-results/
            web/chrono-playwright-report/
      - name: UI audit and recovery regressions
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ux-audit-playwright-report
        run: bash ../scripts/browser-ci.sh ui-audit.spec.ts labs-ui-audit.spec.ts --output ux-audit-test-results
      - name: Preserve UI audit screenshots for early review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-ui-audit
          retention-days: 30
          path: |
            web/ux-audit-test-results/
            web/ux-audit-playwright-report/
      - name: Pachinko physics, type buckets and responsive drawing
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: pachinko-playwright-report
        run: bash ../scripts/browser-ci.sh pachinko.spec.ts --retries 0 --output pachinko-test-results
      - name: Preserve Pachinko evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-pachinko-review
          retention-days: 7
          path: |
            web/pachinko-test-results/
            web/pachinko-playwright-report/
      - name: Firehose physics, GPU presentation and recovery
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: firehose-playwright-report
        run: bash ../scripts/browser-ci.sh firehose.spec.ts --retries 0 --output firehose-test-results
      - name: Preserve Firehose evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-firehose-review
          retention-days: 7
          path: |
            web/firehose-test-results/
            web/firehose-playwright-report/
      - name: Long-session resource and background checks
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: session-playwright-report
        run: bash ../scripts/browser-ci.sh long-session.spec.ts --project desktop --retries 0 --output session-test-results
      - name: Preserve long-session diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-session-review
          retention-days: 3
          path: |
            web/session-test-results/
            web/session-playwright-report/
      - name: Terminal presentation and isolation
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: terminal-playwright-report
        run: bash ../scripts/browser-ci.sh terminal.spec.ts --output terminal-test-results
      - name: Preserve Terminal review screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-terminal-review
          retention-days: 30
          path: |
            web/terminal-test-results/
            web/terminal-playwright-report/
      - name: Terrain and Netgraph visual regression
        working-directory: web
        env:
          CARTOLITE_BASE_URL: http://127.0.0.1:39476
          PLAYWRIGHT_HTML_OUTPUT_DIR: terrain-playwright-report
        run: bash ../scripts/browser-ci.sh --grep '@terrain|@regions' --output terrain-test-results
      # The scale fixture supplies its own state/event stream. Run all of its
      # viewports with no live publisher competing for the renderer CPU.
      # Preserve every case, route count and timing limit; do not run it twice.
      - name: Dense-scene performance budgets
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: scale-playwright-report
        run: bash ../scripts/browser-ci.sh scale-smoke.spec.ts --grep-invert @terrain --output scale-test-results
      - name: Desktop and mobile Playwright smoke
        working-directory: web
        env:
          CARTOLITE_BASE_URL: http://127.0.0.1:39476
        shell: bash
        run: |
          publisher_pid=""
          cleanup() {
            if [[ -n "$publisher_pid" ]]; then
              kill "$publisher_pid" >/dev/null 2>&1 || true
              wait "$publisher_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          (
            sleep 1
            while true; do
              FIXTURE_DELAY_SECONDS=0.04 bash ../scripts/publish-fixture.sh cartolite-mqtt ../testdata/synthetic-live.ndjson
              sleep 0.25
            done
          ) &
          publisher_pid="$!"
          # The live-provider map file ran above in its own browser process.
          # Keep every remaining file and the existing per-test/runtime budgets.
          specs=()
          for spec in e2e/*.spec.ts; do
            [[ "$spec" = e2e/visual-smoke.spec.ts ]] || specs+=("${spec#e2e/}")
          done
          bash ../scripts/browser-ci.sh "${specs[@]}" --grep-invert 'Visual polish|Theme cohesion|long session|Firehose|Pachinko|Chronoscope|UI audit|@terrain|@regions|Terminal|unavailable character readback|keeps a 4k-node / 7k-route first view responsive'
      - name: Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cartolite:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload browser and integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-ci-evidence
          path: |
            artifacts/integration/
            web/test-results/
            web/playwright-report/
            web/scale-test-results/
            web/scale-playwright-report/
            web/terrain-test-results/
            web/terrain-playwright-report/
            web/ux-audit-test-results/
            web/ux-audit-playwright-report/
            web/terminal-test-results/
            web/terminal-playwright-report/
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
          if-no-files-found: ignore
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact-SHA candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: publish
        shell: bash
        run: |
          candidate="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker tag cartolite:ci "$candidate"
          docker push "$candidate"
          docker buildx imagetools inspect "$candidate" > "$RUNNER_TEMP/candidate-inspect.txt"
          digest="$(awk '$1 == "Digest:" {print $2; exit}' "$RUNNER_TEMP/candidate-inspect.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest exact-SHA candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Container logs
        if: failure()
        run: docker logs cartolite || true
      - name: Clean up containers
        if: always()
        run: |
          docker rm --force cartolite cartolite-mqtt >/dev/null 2>&1 || true
          docker network rm cartolite-ci >/dev/null 2>&1 || true

  android:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies) }}
    name: Android API ${{ matrix.api }} shell and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit tests, strict lint and release candidate
        working-directory: android
        run: bash gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Synthetic device acceptance
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            cd android &&
            bash gradlew --no-daemon connectedDebugAndroidTest &&
            mkdir -p app/build/outputs/android-ui &&
            find app/build -path '*/screenshots/*.png' -exec cp {} app/build/outputs/android-ui/ \; &&
            test -s app/build/outputs/android-ui/app-options.png &&
            test -s app/build/outputs/android-ui/chosen-view.png &&
            test -s app/build/outputs/android-ui/load-error.png &&
            test -s app/build/outputs/android-ui/view-loading.png
      - name: Upload native evidence and unsigned candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartolite-android-${{ matrix.api }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/android-ui/

  required:
    name: CI / Required
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies) }}
    needs: [backend, frontend, container, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CONTAINER: ${{ needs.container.result }}
          ANDROID: ${{ needs.android.result }}
        run: test "$BACKEND" = success -a "$FRONTEND" = success -a "$CONTAINER" = success -a "$ANDROID" = success
